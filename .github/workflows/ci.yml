name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      # -race matters here specifically: the agent gateway multiplexes
      # concurrent sessions and in-flight tasks over shared state.
      - name: Test
        run: go test -race ./...

      - name: Cross-compile agent release binaries
        run: scripts/build-agent-releases.sh

      - name: Shellcheck the installer
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck apps/controlplane/release/install.sh scripts/build-agent-releases.sh
